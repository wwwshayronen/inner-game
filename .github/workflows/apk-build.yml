name: Build Inner Game APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: inner-game-debug-keystore-v1

      - name: Ensure stable test signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Inner Game Test,O=Inner Game,C=IL"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk InnerGame-v1.6-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InnerGame-v1.6-Android
          path: InnerGame-v1.6-Android.apk
          if-no-files-found: error
          retention-days: 30
