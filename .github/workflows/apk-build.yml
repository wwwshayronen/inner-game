name: Build APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          mkdir appsrc
          unzip -q InnerGame-v1.5-source.zip -d appsrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app data
        working-directory: appsrc
        run: npm run check
      - name: Build APK
        working-directory: appsrc
        run: gradle -p android --no-daemon assembleDebug
      - name: Rename APK
        run: cp appsrc/android/app/build/outputs/apk/debug/app-debug.apk InnerGame-v1.5-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InnerGame-Android-APK
          path: InnerGame-v1.5-Android.apk
          if-no-files-found: error
          retention-days: 30
