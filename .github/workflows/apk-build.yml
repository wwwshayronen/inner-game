name: Build Inner Game Apps

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/**'
      - 'backend/**'
      - 'icon.b64'
      - '.github/workflows/apk-build.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          base64 --decode icon.b64 > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      - name: Validate web app JavaScript
        run: node --check android/app/src/main/assets/www/app.js
      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk InnerGame-v1.8.1-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InnerGame-v1.8.1-Android-APK
          path: InnerGame-v1.8.1-Android.apk
          if-no-files-found: error
          retention-days: 30

  mac:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare desktop icon
        shell: bash
        run: |
          mkdir -p desktop/build
          base64 -D -i icon.b64 -o desktop/build/icon.png
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validate desktop shell
        run: |
          node --check desktop/main.cjs
          node --check desktop/scripts/prepare-web.cjs
          node --check android/app/src/main/assets/www/app.js
      - name: Build macOS DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: InnerGame-macOS-DMG
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare desktop icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/build | Out-Null
          [IO.File]::WriteAllBytes("desktop/build/icon.png", [Convert]::FromBase64String((Get-Content icon.b64 -Raw)))
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validate desktop shell
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/scripts/prepare-web.cjs
          node --check android/app/src/main/assets/www/app.js
      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: InnerGame-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30


  backend-check:
    name: Hand Analysis API check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Validate API source
        working-directory: backend
        run: npm run check
